# Render Blueprint: the admin dashboard as a free static site.
services:
  - type: web
    name: invyte-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router handles routes client-side, so serve index.html for every path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Your backend's Render URL, ending in /api, e.g. https://invyte-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
